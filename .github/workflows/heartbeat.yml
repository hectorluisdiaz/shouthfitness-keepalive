name: Heartbeat (evita que GitHub deshabilite el keepalive)

# GitHub deshabilita los workflows PROGRAMADOS en un repo sin actividad de
# commits por 60 días (avisa por mail). Como este repo solo corre crons y no
# recibe commits, sin esto el keepalive se apagaría solo cada 2 meses. Este
# job hace un commit vacío una vez por semana para resetear ese contador de
# inactividad, y así el keepalive queda funcionando de forma indefinida sin
# intervención manual.

on:
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit vacío para resetear el timer de 60 días
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "chore: heartbeat $(date -u +%Y-%m-%d) [skip ci]"
          git push
